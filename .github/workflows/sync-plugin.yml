name: Sync generated agent plugins

# Keep authored plugin changes independent from generated marketplace output.
# The source PR merges first; this workflow then opens and auto-merges a
# machine-owned PR containing the pluginpack output for each target.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync ${{ matrix.target }} plugin
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [claude, cursor, codex]
    concurrency:
      group: pluginpack-sync-${{ matrix.target }}
      cancel-in-progress: true
    steps:
      # Use an App token so the generated PR starts its normal CI workflow.
      - name: Mint pluginpack App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PLUGINPACK_CLIENT_ID }}
          private-key: ${{ secrets.PLUGINPACK_APP_KEY }}
          owner: gleanwork
          repositories: glean-indexing-sdk

      - name: Check out trusted main-branch plugin source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # This is a privileged workflow. Never check out an event-provided
          # SHA; the source for synchronization must come from trusted main.
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install plugin build dependencies
        run: npm ci

      - name: Resolve pinned pluginpack version
        id: pluginpack
        run: echo "version=$(node -p \"require('./node_modules/@gleanwork/pluginpack/package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Sync generated ${{ matrix.target }} plugin
        id: sync-plugin
        uses: gleanwork/pluginpack-action@52a7c266ffa90d35289f2a34e83db028c7945ccc # v0.0.0
        with:
          target: ${{ matrix.target }}
          output-repo: gleanwork/glean-indexing-sdk
          token: ${{ steps.app-token.outputs.token }}
          pluginpack-version: ${{ steps.pluginpack.outputs.version }}
          mode: sync

      - name: Enable auto-merge
        if: steps.sync-plugin.outputs.pr-number != ''
        uses: peter-evans/enable-pull-request-automerge@a660677d5469627102a1c1e11409dd063606628d # v3.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          pull-request-number: ${{ steps.sync-plugin.outputs.pr-number }}
          merge-method: squash
