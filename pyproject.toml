[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "glean-indexing-sdk"
version = "1.1.0"
description = "SDK for building custom Glean indexing integrations"
authors = [{ name = "Steve Calvert", email = "steve.calvert@glean.com" }]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<4.0"
dependencies = [
    "click>=8.0",
    "glean-api-client>=0.13.0,<0.14.0",
    "httpx>=0.27,<1",
    "jinja2>=3.1.2",
    "pydantic>=2.0",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "commitizen>=4.4.1",
    "build>=1.0.0",
    "twine>=7.0.0",
    "pip-audit>=2.6.0",
]
test = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.23.2",
    "pytest-cov>=4.1.0",
    "pytest-httpx>=0.35.0",
    "pytest-socket>=0.7.0",
    "pytest-watcher>=0.3.4",
]
aws = [
    "boto3>=1.34.0,<2",
    "watchtower>=3.3.0,<4",
]
lint = [
    "ruff>=0.5",
]
typing = [
    "pyright>=1.1.370",
]
gcp = [
    "google-cloud-logging>=3.11.0,<4",
    "google-cloud-monitoring>=2.22.0,<3",
    "google-cloud-secret-manager>=2.20.0,<3",
]

[project.scripts]
glean-idx = "glean.indexing.cli.main:cli"

[project.urls]
"Source Code" = "https://github.com/gleanwork/glean-indexing-sdk"
Issues = "https://github.com/gleanwork/glean-indexing-sdk/issues"
Documentation = "https://developers.glean.com/libraries/indexing-sdk"

[tool.pyright]
include = ["src", "tests"]
exclude = ["docs/", "**/__pycache__", ".venv/", ".llm/"]
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "basic"
reportMissingImports = false
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedClass = true
reportUnusedFunction = true
reportUnusedVariable = true
reportDuplicateImport = true
reportWildcardImportFromLibrary = true
venv = ".venv"
venvPath = "."

[tool.ruff]
# Retain the formatter width already applied across the repository. The
# separately configured E501 ceiling preserves the 160-column code-style limit
# without a repository-wide reformat in this config-only fix.
line-length = 100
exclude = ["docs/"]
target-version = "py310"

[tool.ruff.lint]
# This is the enforced baseline, not an aspirational selection hidden by broad
# ignores. ANN is intentionally deferred; Pyright basic mode is the typing gate.
select = [
    "E",
    "F",
    "I",
    "W",
    "N",
    "T201",
    # Stable Google-style docstring rules with no package-source debt.
    "D101",
    "D103",
    "D106",
    "D201",
    "D202",
    "D205",
    "D206",
    "D207",
    "D208",
    "D209",
    "D210",
    "D211",
    "D214",
    "D300",
    "D402",
    "D403",
    "D405",
    "D410",
    "D411",
    "D412",
    "D414",
    "D415",
    "D416",
    "D417",
    "D418",
    "D419",
    # Stable pyupgrade rules with no package-source debt.
    "UP001",
    "UP003",
    "UP004",
    "UP005",
    "UP008",
    "UP009",
    "UP010",
    "UP011",
    "UP012",
    "UP013",
    "UP014",
    "UP017",
    "UP018",
    "UP019",
    "UP020",
    "UP021",
    "UP022",
    "UP023",
    "UP024",
    "UP025",
    "UP026",
    "UP029",
    "UP030",
    "UP031",
    "UP032",
    "UP033",
    "UP034",
    "UP036",
    "UP039",
    "UP040",
    "UP041",
    "UP043",
    "UP044",
]

[tool.ruff.lint.per-file-ignores]
# Tests do not require docstrings on every class or function.
"tests/**/*.py" = ["D101", "D103"]
# Documentation snippets stay concise while package source enforces these rules.
"snippets/async_streaming/run_connector.py" = ["D103"]
"snippets/non_streaming/complete.py" = ["D101"]
# These existing multiline docstrings are test descriptions or fixture inputs.
"tests/unit_tests/cli/test_deploy.py" = ["D205", "D209"]
"tests/unit_tests/cli/test_preconditions.py" = ["D205", "D209"]
"tests/unit_tests/cli/test_project.py" = ["D205", "D209"]
"tests/unit_tests/test_async_streaming.py" = ["D205", "D209"]
"tests/unit_tests/test_base_datasource_connector.py" = ["D205", "D209"]
"tests/unit_tests/test_base_streaming_datasource_connector.py" = ["D205", "D209"]
# Test doubles retain external API names and sentinel-style exception names.
"tests/unit_tests/deployment/test_generator.py" = ["N803"]
"tests/unit_tests/deployment/test_secrets.py" = ["N818"]
"tests/unit_tests/testing/harness/test_harness_phase2.py" = ["N806"]
"tests/unit_tests/testing/harness/test_harness_phase3.py" = ["N818"]
# These command-line scripts intentionally write their results to stdout.
"scripts/check_publish_provenance.py" = ["T201"]
"scripts/find_previous_release_tag.py" = ["T201"]
"scripts/smoke_deployment_container_user.py" = ["D103", "T201"]
# Preserve the existing public import order; I001 remains active elsewhere.
"src/glean/indexing/__init__.py" = ["I001"]
"src/glean/indexing/cli/project.py" = ["I001"]
"src/glean/indexing/connectors/__init__.py" = ["I001"]
"src/glean/indexing/recipes/pull/__init__.py" = ["I001"]
"src/glean/indexing/testing/__init__.py" = ["I001"]
"src/glean/indexing/testing/harness/__init__.py" = ["I001"]
"tests/unit_tests/snippets/test_async_streaming_snippet.py" = ["I001"]

[tool.ruff.lint.pycodestyle]
max-line-length = 160

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["glean"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "*/site-packages/*",
    "*/__pycache__/*",
    "*/examples/*",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=10 -ra"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "slow: slow tests",
    "network: tests that require network access",
    "compile: mark placeholder test used to compile integration tests without running them",
    "cloud_integration: tests for cloud provider plugins (AWS/GCP) — not validated against a real cloud API",
]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.hatch.build.targets.wheel]
packages = ["src/glean"] 

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
]
