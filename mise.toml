[tools]
python = "3.10"
uv = "latest"
node = "24"   # pluginpack requires >= 24.15 (package.json engines)

[tasks]

[tasks.setup]
description = "Set up local environment (install dependencies, etc.)"
run = "uv sync --locked --extra dev --extra test --extra lint --extra typing"

[tasks."test:all"]
description = "Run all tests and lint fixes"
run = [
  "mise run test",
  "mise run lint:fix",
  "mise run lint",
]

[tasks.test]
description = "Run unit tests"
run = "uv run pytest -v --tb=auto -rA --durations=10 -p no:logging tests/"

[tasks."test:watch"]
description = "Run tests in watch mode"
run = "uv run ptw --now . -- -vv --tb=auto -rA --durations=10 -p no:logging tests/"

[tasks."test:cov"]
description = "Run tests with coverage"
run = "uv run pytest --cov=glean --cov-report=term --cov-report=html -v tests/"

[tasks.lint]
description = "Run all linters"
run = [
  "mise run lint:ruff:config",
  "mise run lint:ruff",
  "mise run lint:format:check",
  "mise run lint:terraform",
  "mise run lint:pyright",
  "mise run lint:readme",
]

[tasks."lint:diff"]
description = "Run linters on changed files"
run = [
  "bash -lc \"PYTHON_FILES=$(git diff --name-only --diff-filter=d main | grep -E '.*\\.(py|ipynb)$' || true); [ -z \\\"$PYTHON_FILES\\\" ] || uv run ruff check $PYTHON_FILES\"",
  "bash -lc \"PYTHON_FILES=$(git diff --name-only --diff-filter=d main | grep -E '.*\\.(py|ipynb)$' || true); [ -z \\\"$PYTHON_FILES\\\" ] || uv run ruff format $PYTHON_FILES --diff\"",
  "bash -lc \"PYTHON_FILES=$(git diff --name-only --diff-filter=d main | grep -E '.*\\.(py|ipynb)$' || true); if [ -z \\\"$PYTHON_FILES\\\" ]; then uv run pyright; else uv run pyright $PYTHON_FILES; fi\"",
]

[tasks."lint:package"]
description = "Run linters on package files"
run = [
  "uv run ruff check src/glean/indexing",
  "uv run ruff format src/glean/indexing --diff",
  "uv run pyright src/glean/indexing",
]

[tasks."lint:tests"]
description = "Run linters on test files"
run = [
  "uv run ruff check tests",
  "uv run ruff format tests --diff",
  "uv run pyright tests",
]

[tasks."lint:fix"]
description = "Run the lint autofixers"
run = [
  "mise run lint:fix:ruff",
  "mise run format",
]

[tasks."lint:fix:diff"]
description = "Run lint autofixers on changed files"
run = [
  "bash -lc \"PYTHON_FILES=$(git diff --name-only --diff-filter=d main | grep -E '.*\\.(py|ipynb)$' || true); [ -z \\\"$PYTHON_FILES\\\" ] || uv run ruff check $PYTHON_FILES --fix\"",
  "mise run format:diff",
]

[tasks."lint:fix:package"]
description = "Run lint autofixers on package files"
run = [
  "uv run ruff check src/glean/indexing --fix",
  "mise run format",
]

[tasks."lint:fix:ruff"]
description = "Run Ruff autofixer"
run = "uv run ruff check . --fix --exclude .venv/ --exclude **/site-packages/"

[tasks."lint:ruff:config"]
description = "Verify CI resolves the authoritative Ruff policy"
run = "uv run python scripts/check_ruff_config.py"

[tasks."lint:ruff"]
description = "Run Ruff linter"
run = "uv run ruff check . --exclude .venv/ --exclude **/site-packages/"

[tasks."lint:format:check"]
description = "Check code formatting"
run = "uv run ruff format . --diff"

[tasks."lint:terraform"]
description = "Check generated deployment Terraform formatting and validity"
run = "mise exec terraform@1.16.0 -- uv run python scripts/check_deployment_terraform_format.py"

[tasks."lint:pyright"]
description = "Run Pyright type checker"
run = "uv run pyright"

[tasks."lint:readme"]
description = "Lint the README.md file"
run = "npx -y markdown-code check"

[tasks."lint:readme:fix"]
description = "Fix the README.md file"
run = "npx -y markdown-code sync"

[tasks.format]
description = "Run code formatters"
run = [
  "mise run format:ruff",
  "mise run format:imports",
]

[tasks."format:diff"]
description = "Run formatters on changed files"
run = [
  "bash -lc \"PYTHON_FILES=$(git diff --name-only --diff-filter=d main | grep -E '.*\\.(py|ipynb)$' || true); [ -z \\\"$PYTHON_FILES\\\" ] || uv run ruff format $PYTHON_FILES\"",
  "bash -lc \"PYTHON_FILES=$(git diff --name-only --diff-filter=d main | grep -E '.*\\.(py|ipynb)$' || true); [ -z \\\"$PYTHON_FILES\\\" ] || uv run ruff check --select I --fix $PYTHON_FILES\"",
]

[tasks."format:ruff"]
description = "Run Ruff formatter"
run = "uv run ruff format ."

[tasks."format:imports"]
description = "Fix imports"
run = "uv run ruff check --select I --fix ."

[tasks."spell:check"]
description = "Check spelling"
run = "uv run codespell --toml pyproject.toml --skip=docs/"

[tasks."spell:fix"]
description = "Fix spelling"
run = "uv run codespell --toml pyproject.toml -w --skip=docs/"

[tasks.clean]
description = "Clean build artifacts"
run = [
  "rm -rf dist .venv build **/*.egg-info .pytest_cache .coverage htmlcov .ruff_cache",
  "find . -name \"*.pyc\" -delete",
  "find . -name \"__pycache__\" -delete",
]

[tasks.build]
description = "Build the package"
run = "uv run python -m build"

[tasks.release]
description = "Release the SDK and agent plugin in lockstep (use DRY_RUN=true for preview, PRERELEASE=alpha|beta|rc to stay on prerelease track)"
run = [
  """bash -lc '
set -euo pipefail

PRERELEASE_FLAG=""
if [ -n "${PRERELEASE:-}" ]; then
  PRERELEASE_FLAG="--prerelease $PRERELEASE"
fi

# Both release tools operate only through this task. Verify the checkout and
# committed plugin output before either version is changed.
npm run check:release-ready
npm ci
npm run check:plugin-release
npm run diff:plugins
npm run validate:plugins

NEXT_VERSION=$(uv run python -m commitizen bump --get-next $PRERELEASE_FLAG)
PLUGIN_VERSION=$(npm run --silent version:plugin -- "$NEXT_VERSION")

if [ "${DRY_RUN:-}" = "true" ]; then
  uv run python -m commitizen bump --dry-run $PRERELEASE_FLAG
  uv run python -m commitizen changelog --dry-run
  SDK_RELEASE_VERSION="$PLUGIN_VERSION" npm run release:plugin -- "$PLUGIN_VERSION" --dry-run --ci
else
  START_HEAD=$(git rev-parse HEAD)
  TAG="v$NEXT_VERSION"
  if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
    echo "Release tag $TAG already exists." >&2
    exit 1
  fi

  RELEASE_STARTED=true
  rollback_release() {
    status=$?
    trap - EXIT
    if [ "$RELEASE_STARTED" = "true" ]; then
      git tag -d "$TAG" >/dev/null 2>&1 || true
      git reset --hard "$START_HEAD" >/dev/null
      echo "Release failed; restored $START_HEAD and removed $TAG." >&2
    fi
    exit "$status"
  }
  trap rollback_release EXIT

  # Commitizen owns the changelog, release commit, and single vX.Y.Z tag.
  uv run python -m commitizen bump --yes $PRERELEASE_FLAG
  SDK_VERSION=$(uv run --no-sync python -m commitizen version --project)
  if [ "$SDK_VERSION" != "$NEXT_VERSION" ]; then
    echo "Commitizen produced $SDK_VERSION; expected $NEXT_VERSION." >&2
    exit 1
  fi

  # release-it owns only the npm-semver plugin version and artifact rebuild.
  SDK_RELEASE_VERSION="$PLUGIN_VERSION" npm run release:plugin -- "$PLUGIN_VERSION" --ci
  npm run check:plugin-release -- "$PLUGIN_VERSION"

  # Include both ecosystems in the existing release commit, then recreate its
  # tag as annotated so `git push --follow-tags` publishes it.
  uv lock
  git add -u
  git commit --amend --no-edit
  git tag -d "$TAG"
  git tag -a "$TAG" -m "Release $TAG"

  RELEASE_STARTED=false
  trap - EXIT
fi
'""",
]
