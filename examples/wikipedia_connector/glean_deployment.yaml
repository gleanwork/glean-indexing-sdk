connector_name: wikipedia_connector
connector_class: WikipediaConnector
connector_module: connector

cloud: gcp
region: us-central1
cluster_name: <your-cluster-name>
namespace: default

cpu: 250m
memory: 256Mi
cron_schedule: "0 2 * * *"
indexing_mode: FULL

project_id: salessavvy-test
artifact_registry_repo: us-central1-docker.pkg.dev/salessavvy-test/connectors

# Required for private-only GKE clusters (enablePublicEndpoint: false).
